      - kn_3284ccd24359  # Deployment Rollout History > Matching a revision to when the fault began
  - id: q20
    query: "How should the faulty change be undone in a GitOps setup?"
    expected:
      - kn_1b9bd8f6621a  # Attributing a Fault to a GitOps Commit > Remediation: reverting the commit through Git
  - id: q21
    query: "What do the reason, count and last timestamp of a namespace event tell me?"
    expected:
      - kn_398b15151b48  # Reading Events and Container Logs > Interpreting count and timestamps
      - kn_3dcfba03a93e  # Reading Events and Container Logs > What a Kubernetes event records
  - id: q22
    query: "The log tool timed out; what evidence is still available to diagnose the restarts?"
    expected:
      - kn_fa369be3768e  # CrashLoopBackOff > Collecting the termination state
      - kn_85905f724e53  # CrashLoopBackOff > Narrowing down the cause
  - id: q23
    query: "Only the pod list and pod status are available; how far can the cause be narrowed?"
    expected:
      - kn_fa369be3768e  # CrashLoopBackOff > Collecting the termination state
      - kn_85905f724e53  # CrashLoopBackOff > Narrowing down the cause
  - id: q24
    query: "Pod status shows ImagePullBackOff for the new image tag"
    expected:
      - kn_9b59e79f151b  # ImagePullBackOff and ErrImagePull > Wrong image name or tag
      - kn_1721783d983e  # ImagePullBackOff and ErrImagePull > How the two statuses relate
