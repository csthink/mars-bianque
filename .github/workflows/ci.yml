name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BIANQUE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      # Tests compare the local embedding model with the committed fixture, so the model
      # must be present; it is downloaded once and its hash checked by the command.
      - name: Cache the embedding model
        id: embedding-model
        uses: actions/cache@v6.1.0
        with:
          path: ~/.cache/bianque/models
          key: embedding-model-bge-small-en-v1.5-onnx-q-51f1bd0a
      - name: Download the embedding model
        if: steps.embedding-model.outputs.cache-hit != 'true'
        working-directory: backend
        run: uv run --locked bianque knowledge download-model
      - name: Lint, type check and static checks
        run: make lint
      - name: Tests
        run: make test

  # The replay evaluation of every case: recorded model responses, the embedding fixture,
  # and a database and a process on an internal Docker network with no route out. A
  # failed hard gate fails the job; the report is uploaded either way.
  eval:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Evaluate every case
        run: make eval
      - name: Upload the evaluation report
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: eval
          path: .demo/eval
          if-no-files-found: ignore

  # The RBAC the Helm chart renders, with the default and the demo values, only gets,
  # lists and watches.
  helm-rbac:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.0
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint the chart and check its RBAC
        run: make helm-rbac

  public-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan for public content violations
        run: make public-safety

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, type check, unit tests and build
        run: make frontend-check

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        run: |
          cd frontend && npm ci && npx playwright install --with-deps chromium
          cd ../backend && uv sync --locked
      - name: Replay stack in scripted mode, Playwright and the A2A tests
        run: make e2e
      - name: Upload the Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/screenshots
          if-no-files-found: ignore
      - name: Stop the replay stack
        if: always()
        run: make replay-down
