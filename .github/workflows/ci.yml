name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      BIANQUE_TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Lint, type check and static checks
        run: make lint
      - name: Tests
        run: make test

  public-safety:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Scan for public content violations
        run: make public-safety

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint, type check, unit tests and build
        run: make frontend-check

  e2e:
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: |
          (cd backend && uv sync --locked)
          (cd frontend && npm ci && npx playwright install --with-deps chromium)
      - name: Replay stack, fixture and Playwright
        run: make e2e
      - name: Upload the Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: e2e
          path: |
            frontend/playwright-report
            frontend/test-results
            frontend/e2e/screenshots
          if-no-files-found: ignore
      - name: Stop the replay stack
        if: always()
        run: make replay-down
