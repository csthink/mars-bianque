apiVersion: apps/v1
kind: Deployment
metadata:
  name: s1-app
  namespace: demo-s1
  labels:
    app.kubernetes.io/name: s1-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: s1-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s1-app
    spec:
      containers:
        - name: app
          image: bianque-s1-app:dev
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_MODE
              value: standard
            - name: ALLOC_MB
              value: "48"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
            limits:
              memory: 128Mi
              cpu: 200m
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 2
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
