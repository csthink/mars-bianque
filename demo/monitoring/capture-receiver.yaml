# A stand-in for the Bianque webhook endpoint, used while recording evidence packs.
#
# Alertmanager sends notifications to bianque-backend.bianque.svc:8000 (values.yaml).
# Until the Bianque backend is deployed there, this receiver answers on that address
# and prints every request body on one line prefixed with "WEBHOOK ", so the
# recording script can take the webhook body Alertmanager really sent. It reuses the
# demo application image, which is already loaded into the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: bianque
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bianque-backend
  namespace: bianque
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: capture-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: capture-receiver
    spec:
      containers:
        - name: receiver
          image: bianque-s1-app:dev
          imagePullPolicy: Never
          command:
            - python
            - -u
            - -c
            - |
              import http.server
              import json


              class Handler(http.server.BaseHTTPRequestHandler):
                  def do_POST(self):
                      body = self.rfile.read(int(self.headers.get("Content-Length", "0")))
                      print("WEBHOOK " + json.dumps(json.loads(body), separators=(",", ":")))
                      self.send_response(200)
                      self.end_headers()

                  def log_message(self, *args):
                      pass


              http.server.HTTPServer(("", 8080), Handler).serve_forever()
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            periodSeconds: 2
---
apiVersion: v1
kind: Service
metadata:
  name: bianque-backend
  namespace: bianque
spec:
  selector:
    app.kubernetes.io/name: capture-receiver
  ports:
    - port: 8000
      targetPort: 8080
