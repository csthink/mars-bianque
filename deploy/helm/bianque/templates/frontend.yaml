# The web pages, served by nginx, which proxies /api, /mcp, /a2a and the A2A Agent Card to
# the backend on the same origin.
apiVersion: v1
kind: Service
metadata:
  name: bianque-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bianque.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "bianque.selector" (dict "root" . "component" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if and (eq .Values.frontend.service.type "NodePort") .Values.frontend.service.nodePort }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bianque-frontend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "bianque.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "bianque.selector" (dict "root" . "component" "frontend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "bianque.selector" (dict "root" . "component" "frontend") | nindent 8 }}
      {{- with .Values.images.frontend.id }}
      annotations:
        bianque/image-id: {{ . | quote }}
      {{- end }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: {{ include "bianque.image" .Values.images.frontend }}
          imagePullPolicy: {{ .Values.images.frontend.pullPolicy }}
          env:
            - name: BIANQUE_BACKEND_URL
              value: http://bianque-backend:8000
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /index.html
              port: http
            periodSeconds: 5
