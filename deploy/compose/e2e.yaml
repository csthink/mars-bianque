# Laid over replay.yaml by `make e2e`: the database is reachable from the host so that
# the end-to-end tests can load their investigation fixture, and the backend starts no
# investigations of its own, so the fixture is the only one.
services:
  backend:
    environment:
      BIANQUE_REPLAY_SEED: "false"
  db:
    ports:
      - 127.0.0.1:${BIANQUE_E2E_DB_PORT:-55432}:5432
