# Replay profile: Bianque without a cluster, reading evidence packs and recorded model
# responses. Started by `make replay`; the database password comes from .demo/replay.env
# and the demo login from .demo/replay-login.env.
name: bianque-replay

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${BIANQUE_DB_PASSWORD:?run make replay, which generates it}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build: ../../backend
    environment:
      BIANQUE_DATABASE_URL: postgresql+psycopg://postgres:${BIANQUE_DB_PASSWORD}@db:5432/postgres
      BIANQUE_TOOL_BACKEND: pack
      BIANQUE_LLM_MODE: recorded
      BIANQUE_EMBEDDING_MODE: fixture
      BIANQUE_DEMO_USERS: ${BIANQUE_DEMO_USERS:?run make replay, which generates it}
      BIANQUE_SESSION_SECRET: ${BIANQUE_SESSION_SECRET:?run make replay, which generates it}
      # Pages are served over plain http on the workstation, where a browser would not
      # keep a Secure cookie.
      BIANQUE_SESSION_COOKIE_SECURE: "false"
    volumes:
      - models:/models
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build: ../../frontend
    ports:
      - 127.0.0.1:${BIANQUE_REPLAY_PORT:-8080}:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  models:
