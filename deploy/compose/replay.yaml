# Replay profile: Bianque without a cluster, reading evidence packs and recorded model
# responses. Started by `make replay`; the database password comes from .demo/replay.env,
# the demo login and the MCP and A2A clients from .demo/replay-login.env. Once started, the
# backend imports the runbooks and investigates every case with an evidence pack once.
# `make replay LLM_MODE=scripted` answers with the scripted rules instead; `LLM_MODE=live`
# adds live.yaml.
name: bianque-replay

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: ${BIANQUE_DB_PASSWORD:?run make replay, which generates it}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 2s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../../backend
      # The embedding fixture stands in for the model, so the model-free stage.
      target: runtime
      # The skills, copied into the image from the repository root.
      additional_contexts:
        skills: ../../.agents/skills
    environment:
      BIANQUE_DATABASE_URL: postgresql+psycopg://postgres:${BIANQUE_DB_PASSWORD}@db:5432/postgres
      BIANQUE_TOOL_BACKEND: pack
      BIANQUE_LLM_MODE: ${BIANQUE_LLM_MODE:-recorded}
      BIANQUE_EMBEDDING_MODE: fixture
      BIANQUE_REPLAY_SEED: "true"
      BIANQUE_DEMO_USERS: ${BIANQUE_DEMO_USERS:?run make replay, which generates it}
      BIANQUE_SESSION_SECRET: ${BIANQUE_SESSION_SECRET:?run make replay, which generates it}
      BIANQUE_MCP_CLIENTS: ${BIANQUE_MCP_CLIENTS:?run make replay, which generates it}
      BIANQUE_A2A_CLIENTS: ${BIANQUE_A2A_CLIENTS:?run make replay, which generates it}
      # The A2A endpoint the Agent Card announces: nginx on the workstation.
      BIANQUE_A2A_PUBLIC_URL: http://127.0.0.1:${BIANQUE_REPLAY_PORT:-8080}/a2a
      # The case whose evidence pack the tools read: for alerts, manual investigations
      # and MCP calls alike.
      BIANQUE_PACK_CASE: ${BIANQUE_PACK_CASE:-s1-a}
      # Pages are served over plain http on the workstation, where a browser would not
      # keep a Secure cookie.
      BIANQUE_SESSION_COOKIE_SECURE: "false"
    volumes:
      - models:/models
      # Evidence packs, recorded responses, the embedding fixture, question sets and
      # runbooks, read from the repository; the replay image does not hold them.
      - ../../eval:/app/eval:ro
      - ../../knowledge:/app/knowledge:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build: ../../frontend
    ports:
      - 127.0.0.1:${BIANQUE_REPLAY_PORT:-8080}:80
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  db-data:
  models:
