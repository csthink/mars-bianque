[project]
name = "bianque"
version = "0.1.0"
description = "Alert-driven Kubernetes root cause analysis agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "bcrypt>=5,<6",
    "fastapi>=0.115",
    "fastembed>=0.9,<0.10",
    "kubernetes-asyncio>=36",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "openai>=1.40",
    "pgvector>=0.3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-ulid>=3",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
bianque = "bianque.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.0",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bianque"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["bianque", "migrations", "tools", "tests", "../demo/s1-app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["bianque"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The model SDK is imported only by the provider layer"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["openai"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.llm.providers.* -> openai",
    "bianque.llm.providers.* -> openai.*",
]

[[tool.importlinter.contracts]]
name = "Only the real Kubernetes backend imports the Kubernetes client"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["kubernetes_asyncio"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.tools.backends.kubernetes_live -> kubernetes_asyncio",
    "bianque.tools.backends.kubernetes_live -> kubernetes_asyncio.*",
]

[[tool.importlinter.contracts]]
name = "Only the embedding module imports the embedding library"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["fastembed", "tokenizers"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.knowledge.embedding -> fastembed",
    "bianque.knowledge.embedding -> tokenizers",
]

[[tool.importlinter.contracts]]
name = "The evidence gate does not import the model gateway"
type = "forbidden"
source_modules = ["bianque.gate"]
forbidden_modules = ["bianque.llm"]

[[tool.importlinter.contracts]]
name = "Only the API package imports FastAPI"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["fastapi"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.api -> fastapi",
    "bianque.api.* -> fastapi",
    "bianque.api -> fastapi.*",
    "bianque.api.* -> fastapi.*",
]
