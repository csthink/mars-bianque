[project]
name = "bianque"
version = "0.1.0"
description = "Alert-driven Kubernetes root cause analysis agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "a2a-sdk[http-server]>=1.2.2,<1.3",
    "alembic>=1.13",
    "bcrypt>=5,<6",
    "fastapi>=0.115",
    "fastembed>=0.9,<0.10",
    "kubernetes-asyncio>=36",
    "langgraph>=1.2,<1.3",
    "langgraph-checkpoint-postgres>=3.0,<4",
    "mcp>=2.3,<2.4",
    "openai>=1.40",
    "pgvector>=0.3",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.0",
    "python-ulid>=3",
    "pyyaml>=6",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[project.scripts]
bianque = "bianque.cli:main"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.0",
    "jsonschema>=4.23",
    "rfc3339-validator>=0.1.4",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "types-pyyaml>=6",
    "skills-ref>=0.1.1",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bianque"]

[tool.uv]
# Every package is a release at least 14 days old when it is locked. pycparser 3.1 and
# 3.11 (a dependency of cffi, through cryptography and the MCP SDK) were newer than that
# when the MCP SDK was added; lift this once they have been out for 14 days. When the A2A
# SDK was added (2026-10-21), a2a-sdk 1.2.3, google-api-core 2.42, google-auth 2.61 and
# wrapt 2.5.1 (dependencies of the A2A SDK) were newer than that; lift these bounds after
# 2026-11-03.
constraint-dependencies = [
    "pycparser<3.1",
    "a2a-sdk<1.2.3",
    "google-api-core<2.42",
    "google-auth<2.61",
    "wrapt<2.5.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"e2e/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["bianque", "migrations", "tools", "tests", "e2e", "../demo/s1-app"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.importlinter]
root_packages = ["bianque"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The model SDK is imported only by the provider layer"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["openai"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.llm.providers.* -> openai",
    "bianque.llm.providers.* -> openai.*",
]

[[tool.importlinter.contracts]]
name = "Only the real Kubernetes backend imports the Kubernetes client"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["kubernetes_asyncio"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.tools.backends.kubernetes_live -> kubernetes_asyncio",
    "bianque.tools.backends.kubernetes_live -> kubernetes_asyncio.*",
]

[[tool.importlinter.contracts]]
name = "Only the embedding module imports the embedding library"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["fastembed", "tokenizers"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.knowledge.embedding -> fastembed",
    "bianque.knowledge.embedding -> tokenizers",
]

[[tool.importlinter.contracts]]
name = "The evidence gate does not import the model gateway"
type = "forbidden"
source_modules = ["bianque.gate"]
forbidden_modules = ["bianque.llm"]

[[tool.importlinter.contracts]]
name = "The skills package imports no other Bianque package"
type = "forbidden"
source_modules = ["bianque.skills"]
forbidden_modules = ["bianque.agents", "bianque.api", "bianque.llm", "bianque.storage", "bianque.tools"]

[[tool.importlinter.contracts]]
name = "Only the MCP package imports the MCP SDK"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["mcp", "mcp_types"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.mcp.* -> mcp",
    "bianque.mcp.* -> mcp.*",
    "bianque.mcp.* -> mcp_types",
    "bianque.mcp.* -> mcp_types.*",
]

[[tool.importlinter.contracts]]
name = "Only the A2A package imports the A2A SDK"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["a2a"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.a2a -> a2a",
    "bianque.a2a -> a2a.*",
    "bianque.a2a.* -> a2a",
    "bianque.a2a.* -> a2a.*",
]

[[tool.importlinter.contracts]]
name = "Only the API package imports FastAPI"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["fastapi"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.api -> fastapi",
    "bianque.api.* -> fastapi",
    "bianque.api -> fastapi.*",
    "bianque.api.* -> fastapi.*",
]
