[project]
name = "bianque"
version = "0.1.0"
description = "Alert-driven Kubernetes root cause analysis agent"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.40",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "import-linter>=2.0",
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bianque"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "."
files = ["bianque", "tools", "tests"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["bianque"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "The model SDK is imported only by the provider layer"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["openai"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.llm.providers.* -> openai",
    "bianque.llm.providers.* -> openai.*",
]

[[tool.importlinter.contracts]]
name = "Only the API package imports FastAPI"
type = "forbidden"
source_modules = ["bianque"]
forbidden_modules = ["fastapi"]
unmatched_ignore_imports_alerting = "none"
ignore_imports = [
    "bianque.api -> fastapi",
    "bianque.api.* -> fastapi",
    "bianque.api -> fastapi.*",
    "bianque.api.* -> fastapi.*",
]
